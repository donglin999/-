<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>栖河整改评审台</title>

<style>
/* 布局：左侧轮次与题目目录（窄屏收到顶部），右侧逐题卡片：参考素材 → 选项 → 意见 → 整改；页底问题记录簿 */

  --jade:#2f6f63;       /* 已整改 */
  --jade-soft:#d9ebe5;
  --gold:#8a6a2c;       /* 建议 */
  --font-display:"Noto Serif SC","Songti SC","STSong",serif;
  --font-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16191b;--sheet:#1f2326;--ink:#e6e8e3;--ink-2:#a3aaa6;--rule:#383e41;
  --seal:#e0685c;--seal-soft:#3a2321;--jade:#7cc4b2;--jade-soft:#1d332e;--gold:#d2ad66;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#16191b;--sheet:#1f2326;--ink:#e6e8e3;--ink-2:#a3aaa6;--rule:#383e41;
  --seal:#e0685c;--seal-soft:#3a2321;--jade:#7cc4b2;--jade-soft:#1d332e;--gold:#d2ad66;color-scheme:dark}

  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}

.issue-list{display:grid;gap:10px}

.thumbs{display:flex;flex-wrap:wrap;gap:6px}

.tabs{display:flex;gap:6px;width:100%}

.ktag{font-size:12px;padding:0 6px;border:1px solid var(--rule);border-radius:3px;color:var(--ink-2);margin-left:8px;white-space:nowrap;font-family:var(--font-body);font-weight:400;vertical-align:2px}

details.arch>summary{color:var(--ink);font-size:15px}
ol.tl{list-style:none;margin:10px 0 0;padding:0 0 0 14px;border-left:2px solid var(--rule);display:grid;gap:10px}
ol.tl li{position:relative;display:grid;gap:4px}
ol.tl li::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--sheet);border:2px solid var(--ink-2)}
ol.tl li.u::before{border-color:var(--seal);background:var(--seal-soft)}
ol.tl li.c::before{border-color:var(--jade);background:var(--jade-soft)}
.tl-h{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.tl-h b{color:var(--ink);font-weight:600}
ol.tl p{margin:0;white-space:pre-wrap;font-size:14px;max-width:68ch}
.fb{display:grid;gap:8px;margin-top:4px}
.fb-form{display:grid;gap:8px}
.rv{font-size:13.5px;display:grid;gap:6px;padding:6px 10px;border-radius:4px;background:var(--paper)}
.rv .st{justify-self:start;padding:0 7px;border-radius:3px;font-weight:600;font-size:12.5px}
details.old{border:1px dashed var(--rule);border-radius:4px;padding:6px 10px;display:grid;gap:6px;color:var(--ink-2)}
details.old summary{cursor:pointer;font-size:13px}
.empty{color:var(--ink-2);font-size:14px}
dialog.lb{border:none;padding:0;background:transparent;max-width:min(96vw,1600px);max-height:94vh}
dialog.lb::backdrop{background:rgba(10,12,13,.82)}
dialog.lb img{max-width:min(96vw,1600px);max-height:88vh;display:block;border-radius:4px}
dialog.lb p{color:#e6e8e3;font-size:13px;margin:6px 2px 0}
.offline{background:var(--seal-soft);color:var(--seal);padding:10px 14px;border-radius:5px;font-size:14px}
@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  nav.toc{position:static;max-height:none;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<header class="top">
  <h1><span class="seal" aria-hidden="true">审</span>栖河整改评审台</h1>
  <div class="status" id="status">正在连接评审记录……</div>
  <div class="tabs" id="tabs" role="group" aria-label="视图"></div>
  <div class="kinds" id="kinds" role="group" aria-label="按种类看"></div>
</header>

<div class="wrap">
  <nav class="toc" id="toc" aria-label="题目目录"><p class="empty">题目载入后列在这里。</p></nav>
  <main id="main">
    <p class="empty" id="loading">题目、参考图和整改记录都存在这一页的评审记录里，连上后显示。</p>
  </main>
</div>

<dialog class="lb" id="lb"><img id="lb-img" alt=""><p id="lb-cap"></p></dialog>

<script>
(()=>{
const $=s=>document.querySelector(s);
const el=(t,a={},...kids)=>{const n=document.createElement(t);for(const[k,v]of Object.entries(a)){if(k==='class')n.className=v;else if(k==='text')n.textContent=v;else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);else n.setAttribute(k,v)}for(const c of kids)if(c!=null)n.append(c);return n};
const srcOf=r=>r.asset?('/_blob/'+r.asset):(r.url||'');
let db=null,assets=null;
const state={rounds:[],questions:[],answers:{},fixes:{},issues:[],reviews:{},modules:{}};
const lastVerdict=(key,fixAt)=>{const xs=(state.reviews[key]?.items||[]).filter(x=>x.fixAt===fixAt);return xs[xs.length-1]?.verdict||null};
const drafts={};          // 未保存的选择和意见
const lb=$('#lb');
function zoom(src,cap){$('#lb-img').src=src;$('#lb-cap').textContent=cap||'';try{lb.showModal()}catch(e){lb.setAttribute('open','')}}
lb.addEventListener('click',()=>lb.close());

function refNode(r){
  if(r.kind==='text')return el('div',{class:'ref-text',text:(r.label?r.label+'\n':'')+(r.text||'')});
  const src=srcOf(r);
  const img=el('img',{src,alt:r.label||'',loading:'lazy'});
  const b=el('button',{type:'button','aria-label':'放大：'+(r.label||'参考图'),onclick:()=>zoom(src,r.label)},img);
  const fig=el('figure',{class:'ref'},b,el('figcaption',{text:r.label||''}));
  // 附件其实是文字（md、txt 当成图传了上来）：画不出图就取回原文直接显示
  img.addEventListener('error',()=>{fetch(src).then(x=>x.ok?x.text():Promise.reject()).then(t=>fig.replaceWith(refNode({kind:'text',label:r.label,text:t}))).catch(()=>{})},{once:true});
  return fig;
}

// ── 归档与链路 ──
// 题目：最新一版整改你点了“满意”，或我标了 closed（被并进别的模块、不用再答）→ 归档
const archQ=q=>{if(q.closed)return true;const f=state.fixes[q.id];return !!(f?.text&&lastVerdict('q-'+q.id,f.at)==='ok')};
const archI=i=>!!(i.fix?.text&&lastVerdict('i-'+i.id,i.fix.at||0)==='ok');
// 模块：我写了 status done 就归档（2026-10-29 第 4 版起；current＝现在要你做的题，todo＝等我做的整改）
const archM=m=>m.status==='done';
const curQs=m=>(m.current||[]).map(id=>state.questions.find(q=>q.id===id)).filter(Boolean);
// 这道当前题要你做什么：answer 要你回答／accept 要你验收整改／done 你已答或已验收
const needOf=q=>{const f=state.fixes[q.id];if(f?.text)return lastVerdict('q-'+q.id,f.at)?'done':'accept';return state.answers[q.id]?'done':'answer'};
const modNeedsYou=m=>curQs(m).some(q=>needOf(q)!=='done');
// 并进未归档模块的题和意见，只在模块卡片里出现，不再单独列出
// 挂进模块的题（归档模块也算）都只在模块里出现，不再单独列出
const modSet=()=>{const ids=new Set();for(const m of Object.values(state.modules))for(const it of (m.items||[]))ids.add(it.id);return ids};
const loose=q=>!archQ(q)&&!modSet().has(q.id);
const fmt=t=>t?new Date(t).toLocaleString('zh-CN',{hour12:false,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
const optLabel=(q,k)=>(q?.options||[]).find(o=>o.key===k)?.label||k;
function eventsQ(q){
  const ev=[],a=state.answers[q.id],f=state.fixes[q.id];
  if(a)ev.push({at:a.at,who:'你',kind:'答',text:[a.choice?'选：'+optLabel(q,a.choice):'',a.note||''].filter(Boolean).join(' · '),refs:a.images});
  for(const h of (f?.history||[]))ev.push({at:h.at,who:'我',kind:'整改',text:h.text,refs:h.refs});
  if(f?.text)ev.push({at:f.at,who:'我',kind:f.history?.length?'整改（第 '+(f.history.length+1)+' 版）':'整改',text:f.text,refs:f.refs});
  for(const x of (state.reviews['q-'+q.id]?.items||[]))ev.push({at:x.at,who:'你',kind:x.verdict==='ok'?'确认满意':'要求继续改',text:x.note||'',refs:x.images,ok:x.verdict==='ok'});
  if(q.closed)ev.push({at:q.closedAt,who:'我',kind:'收起',text:q.closed});
  return ev;
}
function eventsI(i){
  const ev=[{at:i.at,who:'你',kind:'提意见',text:i.text,refs:i.refs}];
  if(i.fix?.text)ev.push({at:i.fix.at,who:'我',kind:'整改',text:i.fix.text,refs:i.fix.refs});
  for(const x of (state.reviews['i-'+i.id]?.items||[]))ev.push({at:x.at,who:'你',kind:x.verdict==='ok'?'确认满意':'要求继续改',text:x.note||'',refs:x.images,ok:x.verdict==='ok'});
  return ev;
}
function timeline(ev){
  const ol=el('ol',{class:'tl'});
  for(const e of ev.sort((a,b)=>(a.at||0)-(b.at||0))){
    const li=el('li',{class:e.who==='你'?'u':'c'},el('div',{class:'tl-h'},el('b',{text:e.who+' · '+e.kind}),el('span',{text:fmt(e.at)})),e.text?el('p',{text:e.text}):null);
    if(e.refs?.length){const t=el('div',{class:'thumbs'});for(const r of e.refs){if(r.kind==='text')continue;const s=srcOf(r);t.append(el('button',{type:'button','aria-label':'放大附图',onclick:()=>zoom(s,r.label)},el('img',{src:s,alt:r.label||'',loading:'lazy'})))}li.append(t)}
    ol.append(li);
  }
  return ol;
}
function moduleTimeline(m){
  const ev=[];
  for(const l of (m.log||[]))ev.push({at:l.at,who:l.who||'我',kind:l.kind||'合并',text:l.text});
  if(m.userNote)ev.push({at:m.userAt,who:'你',kind:'对合并的意见',text:m.userNote});
  for(const it of (m.items||[])){
    const src=it.kind==='issue'?eventsI(state.issues.find(i=>i.id===it.id)||{text:'',at:0}):eventsQ(state.questions.find(q=>q.id===it.id)||{id:it.id});
    for(const e of src)ev.push({...e,kind:'【'+itemLabel(it)+'】'+e.kind});
  }
  return timeline(ev);
}

function renderToc(){
  const toc=$('#toc');toc.replaceChildren();
  if(view==='archive'){
    for(const rd of state.rounds){const qs=state.questions.filter(q=>q.round===rd.id&&archQ(q)&&qIn(q));if(!qs.length)continue;
      toc.append(el('div',{},el('h3',{text:rd.title}),el('ol',{},...qs.map(q=>el('li',{},el('a',{href:'#a-'+q.id},el('span',{class:'num',text:String(q.num)}),el('span',{class:'dot fixed'}),el('span',{text:q.short||q.title})))))))}
    return;

    const ta=el('textarea',{id:'mod-'+m.id,placeholder:'对这个模块整体的意见（合并错了、漏了什么）写在这里'});ta.value=d;ta.addEventListener('input',()=>{modDrafts[m.id]=ta.value});
    const msg=el('span',{class:'saved',text:m.userNote?'你写过：已保存':''});
    const b=el('button',{type:'button',class:'btn ghost',text:'保存',onclick:async()=>{msg.textContent='保存中……';try{await db.collection('modules').doc(m.id).update({userNote:(modDrafts[m.id]||'').trim(),userAt:Date.now()});msg.textContent='已保存'}catch(e){msg.textContent='没保存上'}}});
    box.append(el('label',{class:'note',for:'mod-'+m.id},'模块意见',ta),el('div',{class:'row'},b,msg));
    sec.append(box);
  }
  return sec;
}

function renderArchive(main){
  main.append(el('p',{class:'empty',text:'这里是你点过“整改满意”的题和意见，以及做完的合并模块。点开看整条链路。'}));
  const mods=Object.entries(state.modules).map(([id,v])=>({id,...v})).filter(archM).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  if(mods.length){const sec=el('section',{class:'issues'},el('h2',{text:'已完成的合并模块'}));for(const m of mods)sec.append(el('details',{class:'chain arch',id:'a-'+m.id},el('summary',{},el('b',{text:m.title||''}),el('span',{class:'saved',text:' · 合并 '+(m.items||[]).length+' 条 · 完成于 '+fmt(m.doneAt)})),m.merged?el('p',{text:m.merged}):null,moduleTimeline(m)));main.append(sec)}
  for(const rd of state.rounds){
    const qs=state.questions.filter(q=>q.round===rd.id&&archQ(q)&&qIn(q));if(!qs.length)continue;
    main.append(el('div',{class:'round-h'},el('h2',{text:rd.title}),el('span',{text:'已归档 '+qs.length+' 题'})));
    for(const q of qs){const ev=eventsQ(q);const ok=ev.filter(e=>e.ok).pop();
      main.append(el('details',{class:'chain arch',id:'a-'+q.id},el('summary',{},el('b',{text:q.num+'. '+(q.short||q.title)}),el('span',{class:'saved',text:q.closed?' · 已收起':' · 确认于 '+fmt(ok?.at)})),el('p',{class:'q-body',text:q.title}),timeline(ev)))}
  }
  const is=state.issues.filter(i=>archI(i)&&inKind(i));
  if(is.length){const sec=el('section',{class:'issues'},el('h2',{text:'已归档的意见'}));for(const i of is){const ok=eventsI(i).filter(e=>e.ok).pop();sec.append(el('details',{class:'chain arch'},el('summary',{},el('b',{text:(i.text||'').slice(0,40)}),el('span',{class:'saved',text:' · 确认于 '+fmt(ok?.at)})),timeline(eventsI(i))))}main.append(sec)}
  if(!mods.length&&!is.length&&!state.questions.some(q=>archQ(q)&&qIn(q)))main.append(el('p',{class:'empty',text:'还没有归档的内容。'}));
}

let view=location.hash==='#archive'?'archive':'open';
// 按种类分开评审：剧情和游戏内容（玩法、界面、美术、数值）各看各的，和轮次无关；选择记在本机
const KINDS=['剧情','玩法','界面','美术','数值'];
let kind='全部';try{const k=localStorage.getItem('desk-kind');if(k==='全部'||KINDS.includes(k))kind=k}catch(e){}
const kindOf=x=>x?.kind||'';
const inKind=x=>kind==='全部'||!kindOf(x)||kindOf(x)===kind||(x.current&&curQs(x).some(q=>kindOf(q)===kind));
const qIn=q=>kind==='全部'||kindOf(q)===kind;
function renderKinds(){
  const box=$('#kinds');const ms=modSet();
  // 数的是要你处理的：模块里要你做的当前题＋没挂进模块的题
  const live=Object.values(state.modules).filter(m=>!archM(m)).flatMap(curQs).filter(q=>needOf(q)!=='done');
  const cnt=k=>[...live,...state.questions.filter(loose)].filter(q=>k==='全部'||kindOf(q)===k).length;
  box.replaceChildren(el('span',{class:'lbl',text:'按种类：'}),...['全部',...KINDS].map(k=>el('button',{type:'button',class:'kind','aria-pressed':String(kind===k),onclick:()=>{kind=k;try{localStorage.setItem('desk-kind',k)}catch(e){}render.jumped=true;render();window.scrollTo(0,0)}},k+' ',el('b',{text:String(cnt(k))}))));
}
function renderTabs(){
  const ms=modSet();const nOpen=state.questions.filter(loose).length+state.issues.filter(i=>!archI(i)&&!ms.has(i.id)).length+Object.values(state.modules).filter(m=>!archM(m)&&modNeedsYou(m)).length;
  const nArch=state.questions.filter(archQ).length+state.issues.filter(archI).length;
  renderKinds();
  const tabs=$('#tabs');tabs.replaceChildren(
    el('button',{type:'button',class:'tab','aria-pressed':String(view==='open'),onclick:()=>{view='open';render.jumped=true;render();window.scrollTo(0,0)}},'待处理 ',el('b',{text:String(nOpen)})),
    el('button',{type:'button',class:'tab','aria-pressed':String(view==='archive'),onclick:()=>{view='archive';render.jumped=true;render();window.scrollTo(0,0)}},'归档 ',el('b',{text:String(nArch)})));
}

function render(){
  const main=$('#main');const y=window.scrollY;main.replaceChildren();
  renderTabs();
  if(view==='archive'){renderArchive(main);renderToc();renderStatus();return}
  const modSec=renderModules();if(modSec)main.append(modSec);
  if(!state.questions.length){main.append(el('p',{class:'empty',text:'这一页还没有题目。Claude 出题后会写进评审记录，刷新即可看到。'}))}
  for(const rd of state.rounds){
    const qs=state.questions.filter(q=>q.round===rd.id&&loose(q)&&qIn(q));if(!qs.length)continue;
    main.append(el('div',{class:'round-h'},el('h2',{text:rd.title}),el('span',{text:rd.note||''})));
    let g=null;
    for(const q of qs){if(q.group&&q.group!==g){g=q.group;main.append(el('div',{class:'group-h',text:g}))}main.append(renderQ(q))}
  }
  if(state.questions.length&&!state.questions.some(q=>loose(q)&&qIn(q)))main.append(el('p',{class:'empty',text:'「'+kind+'」这一类现在没有待处理的题。'}));
  main.append(renderIssues());
  renderToc();renderStatus();
  window.scrollTo(0,y);
  if(location.hash&&!render.jumped){render.jumped=true;document.getElementById(location.hash.slice(1))?.scrollIntoView()}
}

function renderStatus(){
  // 只数现在真要处理的：模块的当前题＋没挂进模块的题；“等我做”数模块 todo
  const live=Object.values(state.modules).filter(m=>!archM(m));
  const qs=[...live.flatMap(curQs),...state.questions.filter(loose)];
  const wait=qs.filter(q=>needOf(q)==='answer').length,review=qs.filter(q=>needOf(q)==='accept').length;
  const mine=live.reduce((n,m)=>n+(m.todo||[]).length,0)+state.issues.filter(i=>!i.fix?.text).length;
  $('#status').replaceChildren('待你回答 ',el('b',{text:String(wait)}),' · 待你验收整改 ',el('b',{text:String(review)}),' · 等我整改 ',el('b',{text:String(mine)}));
}

let pending=null;function schedule(){if(pending)return;pending=requestAnimationFrame(()=>{pending=null;
  const active=document.activeElement;if(active&&active.tagName==='TEXTAREA'){setTimeout(schedule,800);return}render()})}

(async()=>{
  try{assets=await window.claude?.use?.('assets')}catch(e){assets=null}
  try{db=await window.claude?.use?.('db')}catch(e){db=null}
  if(!db){$('#loading').replaceWith(el('p',{class:'offline',text:'连不上评审记录：请在 claude.ai 登录后打开这一页。'}));$('#status').textContent='未连接';return}
  const map=(snap,fn)=>snap.docs.map(d=>fn(d.id,d.data()));
  db.collection('rounds').orderBy('order').onSnapshot(s=>{state.rounds=map(s,(id,v)=>({id,...v}));schedule()});
  db.collection('questions').orderBy('order').onSnapshot(s=>{state.questions=map(s,(id,v)=>({id,...v}));schedule()});
  db.collection('answers').onSnapshot(s=>{state.answers={};for(const d of s.docs)state.answers[d.id]=d.data();schedule()});
  db.collection('fixes').onSnapshot(s=>{state.fixes={};for(const d of s.docs)state.fixes[d.id]=d.data();schedule()});
  db.collection('issues').onSnapshot(s=>{state.issues=map(s,(id,v)=>({id,...v}));schedule()});
  db.collection('reviews').onSnapshot(s=>{state.reviews={};for(const d of s.docs)state.reviews[d.id]=d.data();schedule()});
  db.collection('modules').onSnapshot(s=>{state.modules={};for(const d of s.docs)state.modules[d.id]=d.data();schedule()});
})();
})();
</script>
