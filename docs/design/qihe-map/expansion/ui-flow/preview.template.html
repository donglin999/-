<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>江湖 · 开发交互流程册</title>
<style>
:root{--paper:#f3eee3;--ink:#2d332e;--muted:#62685d;--line:#d9d0bc;--gold:#9a793e;--red:#8c4639}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 system-ui,"PingFang SC",sans-serif}
button,a,input{font:inherit}button{cursor:pointer}a{color:#5c694c}button:focus-visible,a:focus-visible{outline:3px solid #a1563e;outline-offset:3px}
header{padding:22px 32px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:24px}
h1{font:600 27px/1.3 Georgia,"Songti SC",serif;margin:0}header p{margin:7px 0 0;color:var(--muted);font-size:13px}.links{display:flex;gap:18px;white-space:nowrap;font-size:13px}
.layout{display:grid;grid-template-columns:255px minmax(0,1fr);max-width:1800px;margin:auto}
nav{padding:25px 15px;border-right:1px solid var(--line);height:calc(100vh - 107px);overflow:auto;position:sticky;top:0}
nav button{width:100%;display:flex;gap:12px;text-align:left;border:0;background:none;border-radius:8px;padding:13px 10px;color:#50584e;line-height:1.45}
nav button.active{background:#e5dcc9;color:#412e20;font-weight:600}nav button:hover{background:#eae3d6}.fid{font-size:12px;color:var(--gold);padding-top:2px}
main{padding:27px 32px 50px;min-width:0}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--gold);margin:0 0 8px}
h2{font:600 27px/1.4 Georgia,"Songti SC",serif;margin:0 0 6px}.pre{color:var(--muted);font-size:13px;margin:0 0 22px}
.steps{display:flex;gap:10px;margin:0 0 20px;flex-wrap:wrap}.steps button{border:1px solid var(--line);background:#f9f6ef;color:#5c645a;border-radius:7px;padding:10px 13px;text-align:left;flex:1;min-width:150px;font-size:13px}
.steps button.active{border-color:var(--gold);background:#e6dcc5;color:#493820}.steps small{display:block;color:var(--muted);margin-top:3px;font-size:11px}
.workspace{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:24px;align-items:start}
figure{margin:0;background:#e8e0d1;border:1px solid var(--line);border-radius:10px;overflow:hidden}figure img{display:block;width:100%;height:auto}
figcaption{padding:12px 15px;color:var(--muted);font-size:12px;background:#f9f5ed}
.reference-link{display:block;text-decoration:none}.schematic{padding:35px 22px;min-height:300px;background:linear-gradient(135deg,#f8f4eb,#dfdfcd)}
.schematic .mark{font-size:12px;color:var(--gold);letter-spacing:.15em}
.schematic .stage{font:500 30px/1.4 "Songti SC",serif;margin:40px 0 25px}
.schematic .rail{display:flex;gap:7px;flex-wrap:wrap}.rail span{font-size:12px;border:1px solid #b8b6a4;border-radius:6px;padding:8px 10px}
.info{background:#fbf8f1;border:1px solid var(--line);padding:21px;border-radius:10px}
.info .id{font-size:12px;color:var(--gold)}h3{font-size:18px;line-height:1.5;margin:7px 0 19px}
dl{margin:0}dt{font-size:11px;color:#7d7460;font-weight:650;letter-spacing:.08em;margin-top:16px}dd{margin:4px 0 0;font-size:14px}
dd.write{border-left:3px solid #7a8665;padding-left:10px}dd.fail{border-left:3px solid #a57562;padding-left:10px}
.actions{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}.actions button{padding:10px 17px;border:1px solid #aaa087;background:#f9f5ed;border-radius:6px;color:#3b4137}
.actions button.primary{background:#3e4a40;color:#fff;border-color:#3e4a40}.actions button:disabled{opacity:.4;cursor:default}
#count{font-size:12px;color:var(--muted);margin-left:auto}.qa{margin-top:20px;padding-top:15px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:22px}.badge{border:1px solid #b9ab8f;padding:3px 8px;border-radius:4px;color:#725a35;font-size:12px}
@media(max-width:1150px){.workspace{grid-template-columns:1fr}.info dl{display:grid;grid-template-columns:90px 1fr;gap:10px}dt,dd{margin:0}nav{height:auto}}
@media(max-width:720px){header{padding:18px;display:block}.links{margin-top:15px;white-space:normal}.layout{display:block}nav{position:static;border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto;padding:10px;height:auto}nav button{min-width:160px}main{padding:22px 18px}.steps button{min-width:40%}}
</style>
</head>
<body>
<header><div><h1>江湖 · 开发交互流程册</h1><p>四人同屏 · 图像交互 · 悬停详情 <span class="badge">设计演示 / 不连接游戏存档</span></p></div><div class="links"><a href="README.md">文档目录</a><a href="contracts.md">数据合同</a><a href="delivery.md">验收清单</a></div></header>
<div class="layout"><nav id="nav" aria-label="使用情境"></nav><main>
<p class="eyebrow" id="eyebrow"></p><h2 id="title"></h2><p class="pre" id="pre"></p>
<div class="steps" id="steps" aria-label="步骤选择"></div>
<div class="workspace"><section><figure id="figure"></figure><div class="actions"><button id="prev">← 上一步</button><button id="next" class="primary">下一步 →</button><button id="reset">从头查看</button><span id="count"></span></div><p class="note">点击步骤卡或“下一步”浏览状态约定。图片是静态美术参考；图中文字、选中人物不会随步骤真实执行。没有预览图的页面显示结构示意，不冒充运行截图。</p></section>
<section class="info" aria-live="polite"><span class="id" id="stepid"></span><h3 id="action"></h3><dl><dt>到达页面</dt><dd id="screen"></dd><dt>应有反馈</dt><dd id="feedback"></dd><dt>写入边界</dt><dd class="write" id="writes"></dd><dt>失败 / 取消</dt><dd class="fail" id="failure"></dd><dt>返回位置</dt><dd id="returnTo"></dd></dl><div class="qa" id="qa"></div></section></div>
</main></div>
<script type="application/json" id="data">__FLOW_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('data').textContent);
const el=id=>document.getElementById(id);
let flowIndex=0,stepIndex=0;
function route(){const parts=location.hash.slice(1).split('/'),idx=data.flows.findIndex(f=>f.id===parts[0]);flowIndex=idx<0?0:idx;const n=Number(parts[1]||1);stepIndex=Number.isInteger(n)?Math.max(0,Math.min(data.flows[flowIndex].steps.length-1,n-1)):0;render()}
function go(fi,si){const h='#'+data.flows[fi].id+'/'+(si+1);if(location.hash===h)route();else location.hash=h}
function button(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;return b}
function render(){
const f=data.flows[flowIndex],s=f.steps[stepIndex];
el('eyebrow').textContent=f.id+' / 14 个情境 · 55 个步骤';
el('title').textContent=f.title;el('pre').textContent='前置：'+f.preconditions;
el('nav').replaceChildren();data.flows.forEach((x,i)=>{const b=button('',()=>go(i,0));const n=document.createElement('span');n.className='fid';n.textContent=x.id;const t=document.createElement('span');t.textContent=x.title;b.append(n,t);if(i===flowIndex){b.className='active';b.setAttribute('aria-current','page')}el('nav').append(b)});
el('steps').replaceChildren();f.steps.forEach((x,i)=>{const b=button(String(i+1)+' · '+x.action,()=>go(flowIndex,i));if(i===stepIndex){b.className='active';b.setAttribute('aria-current','step')}const small=document.createElement('small');small.textContent=x.screen;b.append(small);el('steps').append(b)});
el('figure').replaceChildren();
if(f.visual){const a=document.createElement('a');a.href=data.art[f.visual];a.target='_blank';a.rel='noopener';a.className='reference-link';a.setAttribute('aria-label','打开完整美术参考');const img=document.createElement('img');img.src=a.href;img.alt=f.visual==='party'?'四人同屏美术参考':f.visual==='inventory'?'行囊悬停美术参考':'人物属性美术参考';a.append(img);el('figure').append(a)}
else{const d=document.createElement('div');d.className='schematic';const m=document.createElement('div');m.className='mark';m.textContent='页面结构示意 · 尚无该页最终效果图';const t=document.createElement('div');t.className='stage';t.textContent=s.screen;const rail=document.createElement('div');rail.className='rail';['图案 / 短名','悬停简要','点击详情','明确确认'].forEach(x=>{const n=document.createElement('span');n.textContent=x;rail.append(n)});d.append(m,t,rail);el('figure').append(d)}
const cap=document.createElement('figcaption');cap.textContent='当前步骤：'+s.id+' · '+s.screen+'。右侧为开发必须实现的行为，参考图不代表该行为已完成。';el('figure').append(cap);
el('stepid').textContent=s.id;['action','screen','feedback','writes','failure','returnTo'].forEach(k=>el(k).textContent=s[k]);el('qa').textContent='关联验收：'+f.acceptance.join(' / ')+'（见验收清单）';
el('prev').disabled=stepIndex===0;el('next').textContent=stepIndex<f.steps.length-1?'下一步 →':flowIndex<data.flows.length-1?'下一情境 →':'回到总入口';
el('count').textContent=(stepIndex+1)+' / '+f.steps.length;
}
el('prev').onclick=()=>{if(stepIndex)go(flowIndex,stepIndex-1)};
el('next').onclick=()=>{if(stepIndex<data.flows[flowIndex].steps.length-1)go(flowIndex,stepIndex+1);else go((flowIndex+1)%data.flows.length,0)};
el('reset').onclick=()=>go(flowIndex,0);
window.addEventListener('hashchange',route);route();
</script>
</body></html>
