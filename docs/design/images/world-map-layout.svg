    <circle cx="2110" cy="1210" r="18" fill="#e0c070" stroke="#5a3b20" stroke-width="4"/><text x="1900" y="1200">鹿门驿</text>
    <circle cx="2796" cy="1394" r="18" fill="#e0c070" stroke="#5a3b20" stroke-width="4"/><text x="2830" y="1380">芦花渡</text>
    <circle cx="2294" cy="1896" r="18" fill="#e0c070" stroke="#5a3b20" stroke-width="4"/><text x="2050" y="1960">三岔山神庙</text>
  </g>
  <!-- 预留地块 -->
  <g fill="none" stroke="#8a6d3b" stroke-width="6" stroke-dasharray="16 12" font-size="40">
    <polygon points="150,1440 210,1475 210,1545 150,1580 90,1545 90,1475"/>
    <polygon points="4550,2270 4610,2305 4610,2375 4550,2410 4490,2375 4490,2305"/>
    <polygon points="2400,2960 2460,2995 2460,3065 2400,3100 2340,3065 2340,2995"/>
    <polygon points="3850,660 3910,695 3910,765 3850,800 3790,765 3790,695"/>
    <polygon points="520,2820 580,2855 580,2925 520,2960 460,2925 460,2855"/>
    <polygon points="2350,2560 2410,2595 2410,2665 2350,2700 2290,2665 2290,2595"/>
    <polygon points="1550,1240 1610,1275 1610,1345 1550,1380 1490,1345 1490,1275"/>
    <polygon points="3300,1980 3360,2015 3360,2085 3300,2120 3240,2085 3240,2015"/>
  </g>
  <g font-size="38" fill="#8a6d3b">
    <text x="240" y="1520">R1 西·峡口蜀道</text>
    <text x="4230" y="2230">R2 东·江夏大港</text>
    <text x="2490" y="3060">R3 南·洞庭方向</text>
    <text x="3600" y="620">R4 东北·佛门寺院</text>
    <text x="600" y="2950">R5 西南·山寨/大帮</text>
    <text x="2440" y="2650">R6 江南小镇</text>
    <text x="1380" y="1220">R7 腹地空节点</text>
    <text x="3380" y="2060">R8 腹地空节点</text>
  </g>
  <!-- 图例 -->
  <g font-size="40" fill="#2b2016">
    <rect x="3700" y="2780" width="1060" height="380" fill="#f6eed8" stroke="#8a6d3b" stroke-width="5"/>
    <line x1="3740" y1="2840" x2="3860" y2="2840" stroke="#a33a2a" stroke-width="14" stroke-dasharray="30 14"/><text x="3880" y="2855">归云谷—三派等距走廊</text>
    <line x1="3740" y1="2910" x2="3860" y2="2910" stroke="#7a5a2e" stroke-width="12"/><text x="3880" y="2925">官道 / 山道</text>
    <polygon points="3800,2960 3830,2978 3830,3012 3800,3030 3770,3012 3770,2978" fill="none" stroke="#8a6d3b" stroke-width="5" stroke-dasharray="10 8"/><text x="3880" y="3005">预留地块（已留路口）</text>
    <text x="3740" y="3090" font-size="32">拓扑示意，非成图坐标合同；WM-2026-10-08.1</text>
    <text x="3740" y="3135" font-size="32">北上；城镇临岸不跨河；单位：大地图单位</text>
  </g>
</svg>
