    <line x1="180" y1="460" x2="180" y2="510"/>
    <line x1="352" y1="640" x2="400" y2="640"/>
    <line x1="820" y1="460" x2="820" y2="545"/>
    <line x1="640" y1="610" x2="720" y2="610"/>
