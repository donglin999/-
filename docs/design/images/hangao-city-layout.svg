<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="2000" height="1600" font-family="PingFang SC, Songti SC, serif">
  <!-- 汉皋城分区拓扑 HG-2026-10-08.1：每块按世界尺寸 1/10 绘制；各块是独立加载场景，经出入口切换，不是拼成一张图 -->
  <rect width="1000" height="800" fill="#efe4c8"/>
