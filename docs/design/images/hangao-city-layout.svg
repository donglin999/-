  <g font-size="15" font-weight="bold" fill="#a33a2a">
    <path d="M520,720 l-14,0 l14,40 l14,-40 z"/>
    <text x="540" y="755">南门 → 官道 → 大地图（归云谷／栖河／巡江司）</text>
    <path d="M940,380 l0,-14 l40,14 l-40,14 z"/>
