  <rect x="610" y="680" width="380" height="110" fill="#f6eed8" stroke="#8a6d3b" stroke-width="1.5"/>
  <g font-size="13" fill="#2b2016">
    <text x="620" y="700">九块室外合计 36.2M 世界像素²，约为第一章栖河</text>
    <text x="620" y="717">（中央 2400×1600 + 五外区 1536×1024 = 11.7M）的 3.1 倍</text>
    <text x="620" y="734">红线＝场景出入口；▢＝预留铺面／驻点院</text>
    <text x="620" y="751">拓扑示意，非坐标合同。HG-2026-10-08.1</text>
    <text x="620" y="768">室内（店铺、酒楼、赌坊等）另计，不计入 3 倍面积</text>
