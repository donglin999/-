<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>剑法 · 五境流光</title><style>

</style><main><div class="eyebrow">小江湖 / SWORD STUDIES</div><h1>剑法 · 流动剑气</h1><a href="slash.html">新版：单剑重斩与打击感 →</a><p>粒子重制 · 青蓝剑流 / 金色碰撞碎星 · 丁 / 丙 / 乙 / 甲 / 绝</p><div class="layout"><section><canvas id="stage" width="1280" height="720"></canvas><progress id="progress" max="1" value="0"></progress><label style="display:block">定格观察 <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" style="width:75%"></label><div id="controls"><button id="replay">重新施展</button><button id="sequence">五境连播</button><button id="stop">停止</button><select id="speed"><option value="1">正常速度</option><option value="0.5">半速观察</option></select><label><input id="sound" type="checkbox" checked>音效</label></div></section><aside><div id="choices"></div><div id="name"></div><p id="desc"></p><div id="phase"></div><small id="stats"></small></aside></div><p style="margin-top:24px">本页是五档表现评审样例，尚未替换战斗中的技能。<a href="legacy.html">原有技能对照 →</a></p></main><script src="../../js/particle-fx.js"></script><script src="sword-choreography.js?v=5"></script><script src="sword-particles.js?v=5"></script><script src="sword.js?v=5"></script></html>
