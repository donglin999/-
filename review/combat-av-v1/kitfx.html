<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全部技能特效</title><link rel="stylesheet" href="review.css"><style>body{max-width:1100px}#stage{width:100%;image-rendering:auto;border:1px solid #466069;background:#0b0d18;border-radius:8px}#choices{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}#choices b{display:inline-block;min-width:1.4em;margin-right:6px;padding:1px 5px;border-radius:3px;font-weight:600}h1{font-size:32px}.toolbar{position:static}#status{font:13px monospace;color:#a1c4d5}#note{color:#a4aca8;font-size:13px;line-height:1.8;min-height:3.6em}#concepts{display:flex;gap:10px;flex-wrap:wrap}#concepts figure{margin:0;width:calc(25% - 8px);min-width:180px;cursor:pointer}#concepts img{width:100%;border-radius:6px;border:1px solid #33433f}#concepts figcaption{font-size:12px;color:#9fb0aa}</style>
<body><header><div class="eyebrow">技能特效 v4 · 全部招式与内功主动 · 专属编排 + 组件库模板</div><h1>全部技能特效</h1><p>专属编排：归云谷剑法五档、第一批 8 招、其余 7 门绝招；其余招式与内功主动由<b>组件库模板</b>按兵器类、属性、档位、目标、段数、异常自动编排（中性白光素材运行时按属性着色）。按钮颜色为品阶，标“专”的是专属编排。说明见 <code>docs/design/v4-vfx-kit.md</code>。</p></header>
<div class="toolbar"><label>门派 <select id="fsect"><option value="">全部</option></select></label><label>品阶 <select id="fgrade"><option value="">全部</option><option>丁</option><option>丙</option><option>乙</option><option>甲</option><option>绝</option></select></label><label>用途 <select id="frole"><option value="">全部</option></select></label><span id="fcount"></span></div><div id="choices"></div><div class="toolbar"><button id="replay">重播</button><button id="all">全部连播</button><label>速度 <select id="speed"><option value="1">正常</option><option value="0.5">半速</option><option value="0.25">四分之一</option></select></label><label>BP <select id="bp"><option>0</option><option>1</option><option>2</option><option>3</option></select></label><label><input id="grp" type="checkbox" checked>群体招式演示 3 个目标</label><label><input id="glow" type="checkbox" checked>辉光</label></div>
<canvas id="stage" width="1280" height="720"></canvas><p id="status">加载中…</p><p id="note"></p><div id="concepts"></div><footer><a href="swordfx.html">归云谷剑法五档</a> · 独立评审页，尚未接入战斗。</footer>
<script src="../../js/wuxia-kit-data.js"></script><script src="../../js/wuxia-fx.js"></script><script src="../../js/fx/fx-gy.js"></script><script src="../../js/fx/fx-am.js"></script><script src="../../js/fx/fx-bh.js"></script><script src="../../js/fx/fx-pj.js"></script><script src="../../js/fx/fx-zc.js"></script><script src="../../js/fx/fx-hc.js"></script><script src="../../js/fx/fx-sf.js"></script><script src="../../js/fx/fx-gj.js"></script><script src="../../js/fx/fx-hui.js"></script><script src="../../js/fx/fx-xf.js"></script><script src="../../js/fx/fx-xfo.js"></script><script src="../../js/fx/fx-ren.js"></script><script src="../../js/fx/fx-jh-a.js"></script><script src="../../js/fx/fx-jh-b.js"></script><script src="../../js/fx/fx-jh-c.js"></script><script>
'use strict';
const $=q=>document.querySelector(q),GC={'丁':'#9aa3a0','丙':'#6fc29a','乙':'#6fa8e0','甲':'#e0b44a','绝':'#e05a4a'};
const NOTE={bh_s1:'丙 · 暗器·寒 · 单体 · 三枚金针品字飞出、依次钉入肩胸腰，霜花点亮，靛蓝细环收紧；霜蓝数字 + 封穴浮字。',gy_p3:'乙 · 拳掌·阳 · 单体2段 · 前小后大两道暖金掌劲叠压，第二掌冲击环更大，山岚被推开；暖金数字 + 内伤。',hc_s3:'乙 · 拳掌·雷 · 单体 · 拳前蓄劲后短促直冲，方形震劲命中，金紫震波、碎石后崩、地面涟漪；电金数字 + 内伤。',hui_q3:'乙 · 音律·阴 · 单体 · 夜色压暗，三圈黛紫音波由近及远贯穿，经脉细线收束；黛紫数字 + 封穴。',gj_s4:'甲 · 刀·炎 · 群体 · 火刀高举、契约纸卷悬空焦卷、地面火线环绕 → 大弧火痕劈下，纸卷断成两截飞散，热浪推镜；朱橙数字 + 惊惧。',sf_s4:'甲 · 剑·风 · 群体 · 身后升起松枝剑气、地面风纹 → 十道松针剑气连发横扫；青绿数字。',hui_q4a:'甲 · 音律 · 我方群体解除并恢复 · 月白音波在施法者一侧平缓扩散，乱纹被抚平，脚下莲叶柔光、翠绿光点上升；翠绿 +64 与“解除·中毒”。',zc_s5:'绝 · 剑·寒 · 单体 · 夜江冷月、剑意自下而上升起 → 霜蓝剑光光柱劈入，光爆与两道水墙掀起 → 水落江平、霜花飘落；绝招字号霜蓝数字。'};
const imgs=['bb_street','b_hero','b_bandit'].map(n=>{const i=new Image();i.src='../../assets/'+n+'.webp';return i});
Promise.all([...WuxiaFX.assetDirs.map(d=>WuxiaFX.load('../../'+d).catch(e=>console.warn('素材包缺失 '+d))),WuxiaFX.load('../../assets/fx/sword_v1/'),WuxiaFX.load('../../assets/fx/v4_v1/'),WuxiaFX.load('../../assets/fx/v4_b2/').catch(e=>console.warn('素材包缺失 v4_b2')),WuxiaFX.load('../../assets/fx/kit_v1/').catch(e=>console.warn('素材包缺失 kit_v1')),...imgs.map(i=>i.complete&&i.naturalWidth?0:new Promise((ok,no)=>{i.onload=ok;i.onerror=()=>no(i.src)}))]).then(()=>{
 const SECT={gy:'归云谷',bh:'白鹇谷',zc:'照川剑派',hc:'合川拳门',sf:'松风观',gj:'归烬堂',pj:'巡江司',am:'正道盟',hui:'清徽阁',xf:'内功',yh:'人物·医',yl:'人物',qx:'人物',lh:'人物',qf:'人物',rq:'人物',lhg:'人物',hzc:'人物'};const ROLE={dmg:'伤害',heal:'治疗',cleanse:'净化',guard:'护卫',defend:'防御强化',buff:'增益',ding:'定神',mp:'回内',reveal:'看破',debuff:'控制'};const sectOf=k=>SECT[k.split('_')[0]]||'江湖散学';const roleOf=k=>{const s=WuxiaSkills[k];return s.spec?s.spec.role:(s.side?'heal':'dmg')};const ALL=Object.keys(WuxiaSkills).filter(k=>['v4','sword','kit'].includes(WuxiaSkills[k].set)&&!k.startsWith('heart_')).sort((a,b)=>'丁丙乙甲绝'.indexOf(WuxiaSkills[a].grade)-'丁丙乙甲绝'.indexOf(WuxiaSkills[b].grade)||a.localeCompare(b));for(const v of [...new Set(ALL.map(sectOf))])$('#fsect').insertAdjacentHTML('beforeend',`<option>${v}</option>`);for(const [k,v] of Object.entries(ROLE))$('#frole').insertAdjacentHTML('beforeend',`<option value="${k}">${v}</option>`);let keys=ALL.slice();
 const fx=new WuxiaFX($('#stage'),{bg:imgs[0],hero:imgs[1],foe:imgs[2]});let current=keys[0],queue=[],last=null,paused=false,gap=0;
 const CONCEPT={bh_s1:[['bh_s1_a','钉入',520]],gy_p3:[['gy_p3_a','第二掌',700]],hc_s3:[['hc_s3_a','命中',420]],hui_q3:[['hui_q3_a','贯穿',650]],gj_s4:[['gj_s4_a','起手',600],['gj_s4_b','劈落',860]],sf_s4:[['sf_s4_a','松枝升起',520],['sf_s4_b','松针齐发',900]],hui_q4a:[['hui_q4a_a','音波扩散',500],['hui_q4a_b','莲叶回复',950]],zc_s5:[['zc_s5_a','剑意升起',900],['zc_s5_b','剑光劈入',1350],['zc_s5_c','水落江平',2400]]};
 const play=k=>{current=k;const sk=WuxiaSkills[k];fx.group=sk.group&&sk.side!=='ally'&&$('#grp').checked?3:0;fx.play(k,7,{bp:+$('#bp').value});paused=false;$('#note').textContent=NOTE[k]||(()=>{const sp=WuxiaSkills[k].spec;return sp?`${sp.grade} · ${sp.wc}${sp.el?'·'+sp.el:''} · ${ROLE[sp.role]||sp.role} · ${sp.group?'群体':sp.side==='foe'?'单体':sp.side==='self'?'自身':'我方'}${sp.hits>1?' · '+sp.hits+'段':''}${sp.st.length?' · 可能'+sp.st.join('、'):''} · 组件库模板 F${Math.min(4,sp.tier)}`:''})();$('#concepts').innerHTML='';for(const [id,cap,ms] of CONCEPT[k]||[]){const f=document.createElement('figure');f.innerHTML=`<img src="../../art_sources/v4_vfx_concepts_v1/${id}.png" alt="${cap}"><figcaption>概念图 · ${cap} · 点击跳到 ${ms}ms</figcaption>`;f.onclick=()=>{window.SkillReview.seek(k,ms);document.querySelector('#stage').scrollIntoView({block:'center'})};$('#concepts').append(f)}document.querySelectorAll('#choices button').forEach(b=>b.classList.toggle('active',b.dataset.key===k))};
 const list=()=>{$('#choices').innerHTML='';keys=ALL.filter(k=>(!$('#fsect').value||sectOf(k)===$('#fsect').value)&&(!$('#fgrade').value||WuxiaSkills[k].grade===$('#fgrade').value)&&(!$('#frole').value||roleOf(k)===$('#frole').value));$('#fcount').textContent=`${keys.length} 项`;for(const k of keys){const s=WuxiaSkills[k],b=document.createElement('button');b.dataset.key=k;b.innerHTML=`<b style="background:${GC[s.grade]};color:#111">${s.grade}</b>${s.name}${s.set==='kit'?'':'<small style="color:#e0b44a"> 专</small>'}`;b.onclick=()=>{queue=[];play(k)};$('#choices').append(b)}
 };list();['#fsect','#fgrade','#frole'].forEach(q=>$(q).onchange=list);$('#replay').onclick=()=>{queue=[];play(current)};$('#all').onclick=()=>{queue=keys.slice();play(queue.shift())};$('#bp').onchange=$('#grp').onchange=()=>{queue=[];play(current)};$('#glow').onchange=e=>fx.glowOn=e.target.checked;
 function frame(now){const dt=last===null?0:Math.min(50,now-last);last=now;
  if(!paused){fx.update(dt*+$('#speed').value);if(fx.done&&queue.length&&(gap+=dt)>500){gap=0;play(queue.shift())}}
  const s=WuxiaSkills[current];fx.render();$('#status').textContent=`${s.grade} · ${s.name} · ${Math.min(Math.round(fx.t),s.dur)} / ${s.dur}ms · 粒子 ${fx.parts.length} · 累计 ${fx.used}/${s.budget} · 峰值 ${fx.peak} · 图集 ${fx.atlas.size}`;requestAnimationFrame(frame)}
 window.SkillReview={fx,play,seek(k,ms){play(k);for(let t=0;t<ms;t+=16)fx.update(Math.min(16,ms-t));paused=true;fx.render()},resume(){paused=false}};
 play(current);requestAnimationFrame(frame);
}).catch(e=>{$('#status').textContent='素材加载失败：'+e});
</script></body></html>
