<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>技能粒子驱动评审</title><link rel="stylesheet" href="review.css"><style>body{max-width:1100px}#stage{width:100%;border:1px solid #466069;background:#131c29;border-radius:8px}#choices{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}#stats{font:13px monospace;color:#a1c4d5}h1{font-size:32px}pre{white-space:pre-wrap;color:#a2b5be;font-size:12px}.toolbar{position:static}canvas{aspect-ratio:16/9}</style><body><header><div class="eyebrow">粒子技能 · 底层驱动样例</div><h1>聚集、流动、爆发、消散</h1><p>四组样例共用同一驱动，通过发射器配置组合。点击类型可重播；命中声与视觉由同一技能时间线触发。</p></header><div id="choices"></div><div class="toolbar"><button id="replay">重播</button><button id="stop">停止并清空</button><label>速度 <select id="speed"><option value="1">正常</option><option value="0.5">半速</option></select></label><label>密度 <select id="density"><option value="0.5">轻量</option><option value="1" selected>标准</option><option value="1.5">丰富</option></select></label><label><input id="sound" type="checkbox" checked>命中音效</label><label><input id="glow" type="checkbox" checked>局部辉光</label></div><p id="stats"></p><canvas id="stage" width="960" height="540"></canvas><p id="event">准备播放</p><details><summary>查看当前技能配置</summary><pre id="config"></pre></details><footer><a href="legacy.html">查看原有22个技能及通用特效</a> · 粒子引擎与预设已可供战斗调用；此页独立试演，不自动替换全部现有技能。</footer><script src="../../js/particle-fx.js"></script><script src="../../js/particle-presets.js"></script><script src="particles.js"></script></body></html>
