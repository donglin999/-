<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>64招式 · 全量命名数值与图标</title><style>body{margin:0;background:#182322;color:#eee8da;font:16px/1.7 Georgia,"Songti SC",serif}main{max-width:1400px;margin:auto;padding:32px}a{color:#b7ddce}header{border-bottom:1px solid #5b7467;padding-bottom:20px}select,input{padding:10px;font:inherit;background:#24332d;color:inherit;border:1px solid #5b7467}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:24px}article{background:#22322b;border:1px solid #496151;padding:16px;border-radius:8px}img{width:144px;height:144px;object-fit:contain;image-rendering:auto;float:right}h2{margin:0;font-size:22px}small{color:#b3c6b8}details{clear:both;padding-top:12px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #496151;padding:5px;text-align:left}pre{white-space:pre-wrap;word-break:break-word;font-size:12px}footer{margin-top:32px;color:#b3c6b8}.samples{display:flex;gap:12px;align-items:center;clear:both}.samples img{float:none}h3{margin:16px 0 6px}</style><main><header><a href="../">返回武学图录</a><h1>六十四式 · 命名、数值与图标</h1><p>21门外功／64项招式。甲与绝级名称具有技理和人物选择的含义。每招都有独立数值合同、BP分档及512px生产图标。</p><p>本页展示设计完成度。基础课与已实现旧技能继续按正式教学获得；后续招式尚需逐项实现战斗机制，数值通过离线边界验证，未宣称全年平衡已通过。</p><label>门派 <select id="group"><option value="">全部</option></select></label> <label>搜索 <input id="search" placeholder="名称或ID"></label> <span id="count"></span></header><section id="grid"></section><footer>原稿：内置image_gen生成记录全部保留；本轮沿用63张原稿、金针刺穴定向重生成1张，导出统一透明安全边。512×512，最长可见边384px，四边≥64px。生产导出不改变原画主体或配色。静态图标不等于战斗特效已完成。</footer></main><script>
let rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('../data.json?v=moves-3').then(r=>r.json()).then(d=>{rows=d.entries.filter(r=>r.kind==='skill');document.querySelector('#group').innerHTML+=[...new Map(rows.map(r=>[r.group,r.group_name]))].map(([k,n])=>`<option value="${esc(k)}">${esc(n)}</option>`).join('');render()});function render(){const g=document.querySelector('#group').value,q=document.querySelector('#search').value;const list=rows.filter(r=>(!g||r.group===g)&&(!q||[r.name,r.id].some(s=>s.includes(q))));document.querySelector('#count').textContent=list.length+'／64';document.querySelector('#grid').innerHTML=list.map(r=>{const c=r.combat;return `<article data-id="${r.id}"><img src="../../../${r.production_icon.path}" alt="${esc(r.name)}图标"><small>${esc(r.group_name)} · ${r.grade}级 · ${r.id}</small><h2>${esc(r.name)}</h2><p>内力 ${c.mp} · 威力 ${c.total_power}<br>${c.base_hits}段 · 冷却 ${c.cooldown_self_actions}次行动</p><p>${esc(r.effect)}</p><details><summary>名称含义、BP与完整参数</summary><p>${esc(r.naming.meaning)}</p><table><tr><th>BP</th><th>威力</th><th>段数</th><th>削盾上限</th></tr>${c.bp.map(b=>`<tr><td>${b.spent}</td>${b.available?`<td>${b.total_power}</td><td>${b.hits}</td><td>${b.shield_cap}</td>`:'<td colspan="3">不可施放</td>'}</tr>`).join('')}</table><h3>图标小尺寸检查</h3><div class="samples">${[48,56,72].map(n=>`<img style="width:${n}px;height:${n}px" src="../../../${r.production_icon.path}" alt="${n}px">`).join('')}</div><pre>${esc(JSON.stringify(c,null,2))}</pre><a href="../../../${r.production_icon.source}">查看保留的生成原稿</a></details></article>`}).join('')}document.querySelector('#group').onchange=render;document.querySelector('#search').oninput=render;
</script></html>
